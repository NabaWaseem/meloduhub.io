<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MelodyHub Welcome</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      border: 20px solid transparent;
      border-radius: 20px;
      box-shadow: 0 0 25px #209649, 0 0 35px #f3f3f3, 0 0 45px #1db954;
    }

    .welcome-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 1.2s ease-in-out;
    }

    .logo img {
      width: 180px;
      filter: drop-shadow(0 0 15px #1db954) drop-shadow(0 0 25px white);
      animation: pop 1.5s ease-in-out;
    }

    h1 {
      font-size: 58px;
      letter-spacing: 2px;
    }

    p {
      font-size: 18px;
      max-width: 450px;
      line-height: 1.6;
      opacity: 0.8;
    }

    .enter-home {
      font-size: 38px;
      margin-top: 25px;
      cursor: pointer;
      color: #1DB954;
      font-weight: bold;
      transition: 0.3s ease;
      text-decoration: none;
    }

    .enter-home:hover {
      transform: scale(1.08);
      color: #39e57a;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="welcome-container">
    <div class="logo">
      <img src="./images/logo.svg" alt="MelodyHub Logo">
    </div>

    <h1>MelodyHub</h1>
    <p>A platform where you enjoy any kind of audio listening without any distortion.</p>

    <a href="./home.html" class="enter-home">HOME</a>
  </div>
</body>
</html>
