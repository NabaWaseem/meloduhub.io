<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Melody Hub</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: Poppins, Arial, sans-serif;
    background: #0e0e0e;
    color: #e4e4e4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: #111;
    padding: 40px 50px;
    border-radius: 14px;
    box-shadow: 0 0 20px #00ff95;
    border: 1px solid #00ff95;
    text-align: center;
    max-width: 500px;
}

h1 {
    color: #00ff95;
    text-shadow: 0 0 8px #00ff95, 0 0 20px #00ff95;
    margin-bottom: 20px;
    font-size: 32px;
}

h2 {
    color: #00ff95;
    text-shadow: 0 0 6px #00ff95, 0 0 12px #00ff95;
    margin-bottom: 30px;
    font-size: 22px;
}

.contact-details {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start; /* label & value aligned left inside container */
}

.contact-details p {
    font-size: 16px;
    color: #bfbfbf;
    margin: 0;
    text-align: left;
}

.contact-details strong {
    color: #00ff95;
    width: 70px;
    display: inline-block;
}

.back-home {
    margin-top: 30px;
}

.back-home a {
    color: #00ff95;
    text-decoration: none;
    font-size: 15px;
    transition: 0.3s;
}

.back-home a:hover {
    text-shadow: 0 0 10px #00ff95, 0 0 20px #00ff95;
}

@media (max-width: 500px) {
    .container {
        padding: 25px 20px;
        margin: 20px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>Contact Us</h1>
    <h2>Get in Touch</h2>

    <div class="contact-details">
        <p><strong>Address:</strong> Melody Hub Studio, Lahore, PK</p>
        <p><strong>Phone:</strong> +92 301 4456789</p>
        <p><strong>Email:</strong> support@melodyhub.com</p>
        <p><strong>Hours:</strong> Mon–Fri, 10 AM – 6 PM</p>
    </div>

    <div class="back-home">
        <a href="home.html">← Back to Melody Hub</a>
    </div>
</div>

</body>
</html>
